<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <!-- Apply saved theme + language before first paint to avoid a flash of the wrong theme/direction -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('my-todo-app:settings')
          var saved = raw ? JSON.parse(raw).data : null
          var theme = saved && saved.theme
            ? saved.theme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var lang = saved && saved.language
            ? saved.language
            : navigator.language.toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en'
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          root.lang = lang
          root.dir = lang === 'fa' ? 'rtl' : 'ltr'
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>My Todo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
